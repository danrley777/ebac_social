[project]
name = "ebac-social-api"
version = "1.0.0"
description = "API REST de uma rede social inspirada no X"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<7.0",
  "djangorestframework>=3.16,<4.0",
  "django-cors-headers>=4.7,<5.0",
  "factory-boy>=3.3,<4.0",
  "pytest>=8.3,<10.0",
  "pytest-django>=4.11,<5.0",
  "psycopg2-binary>=2.9,<3.0",
  "gunicorn>=23.0,<27.0",
  "whitenoise>=6.9,<7.0"
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
