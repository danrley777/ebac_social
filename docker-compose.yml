name: ebac-social

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebac_social
      POSTGRES_USER: ebac_social
      POSTGRES_PASSWORD: local-development-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebac_social -d ebac_social"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: local-docker-development-key
      DEBUG: "1"
      DATABASE_URL: postgresql://ebac_social:local-development-password@database:5432/ebac_social
      DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1 backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
